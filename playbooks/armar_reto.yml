---
# armar_reto.yml — Desplegá tu estación de guardia para el postmortem de web01.
# MULTI-DISTRO: Debian/Ubuntu (apt) · Arch (pacman) · Fedora/RHEL (dnf).
#
# ESCENARIO (no es hacking, es laburo de SRE): entrás de guardia, web01 tuvo una
# noche fea y te dejaron el volcado del journal. Este playbook, en un solo paso:
#   1) Comprueba que tu distro esté soportada.
#   2) Instala gawk con el módulo genérico 'package' (apt, pacman o dnf según tu
#      distro), envuelto en block/rescue: si no hay sudo o no hay red, avisa y sigue.
#   3) Crea el área de trabajo  datos/reto/          (módulo file).
#   4) Copia el material del incidente: journal + lista de units  (módulo copy).
#   5) Genera una MISION.txt personalizada con TUS datos  (módulo template + facts).
#   6) Deja la nota del equipo con permisos 0600 = solo su dueño  (security by design).
#   7) Te muestra cómo se llama el servicio de SSH EN TU DISTRO (la trampa clásica
#      de la clase: ssh.service en Debian/Ubuntu, sshd.service en Arch/Fedora).
#
# La gracia de Ansible: el MISMO playbook arma el laboratorio en Ubuntu, Arch o
# Fedora sin que cambies una línea. Y es IDEMPOTENTE: corrélo mil veces, siempre
# deja el entorno igual (2ª corrida = changed=0).
#
# Con una sola VM alcanza: corre todo contra localhost (grupo [local]).
#
# ¿No tenés Ansible? Corré primero:   bash comprobar_requisitos.sh
#
# Simular sin aplicar (RECOMENDADO la 1ª vez):
#   ansible-playbook armar_reto.yml -l local --check --diff
# Aplicar de verdad:
#   ansible-playbook armar_reto.yml -l local
#   (si al instalar gawk te pide contraseña de sudo, agregá  -K)

- name: Armar la estación de guardia del postmortem (Debian/Ubuntu + Arch + Fedora)
  hosts: local
  become: false

  vars:
    # true = instala gawk (necesita sudo; agregá -K si te pide contraseña).
    # Poné false si ya tenés awk y no querés usar sudo.
    instalar_gawk: true
    area: "{{ playbook_dir }}/../datos/reto"
    # LA TRAMPA DE LA CLASE: la MISMA cosa, distinto nombre de unit según la familia.
    unit_ssh: "{{ 'ssh.service' if ansible_os_family == 'Debian' else 'sshd.service' }}"

  pre_tasks:
    # Si tu distro no es de estas 3 familias, el playbook se detiene ACÁ y te lo
    # explica (en vez de romper a la mitad).
    - name: Comprobar que la distribución está soportada
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'Archlinux', 'RedHat']
        fail_msg: >-
          Distro no soportada: {{ ansible_distribution }}
          (familia {{ ansible_os_family }}). Este material corre en Debian/Ubuntu
          (gestor apt), Arch (gestor pacman) y Fedora/RHEL (gestor dnf). Las tres
          usan systemd, así que todo lo de la clase vale igual en las tres.
        success_msg: >-
          Distro soportada: {{ ansible_distribution }} ({{ ansible_os_family }}).
        quiet: true

    # UN solo módulo, TRES gestores: 'package' elige apt / pacman / dnf por vos.
    # block/rescue: si falla (sin sudo, sin red, repos rotos) NO te tira el
    # laboratorio abajo — te avisa y seguís, que awk casi seguro ya lo tenés.
    - name: Instalar gawk de forma tolerante a fallos
      when: instalar_gawk | bool
      block:
        - name: Instalar gawk (el mismo módulo usa apt, pacman o dnf según tu distro)
          ansible.builtin.package:
            name: gawk
            state: present
          become: true
      rescue:
        - name: Avisar que no se pudo instalar (y seguir igual)
          ansible.builtin.debug:
            msg: >-
              No pude instalar gawk ({{ ansible_os_family }}). Seguimos igual:
              el reto se resuelve con grep/awk/sort/uniq, que ya vienen en
              cualquier distro. Si te falta awk, instalalo a mano y volvé a correr.

  tasks:
    - name: Crear el área de trabajo del postmortem
      ansible.builtin.file:
        path: "{{ area }}"
        state: directory
        mode: '0755'

    - name: Copiar el material del incidente (journal + lista de units)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/{{ item }}"
        dest: "{{ area }}/{{ item }}"
        mode: '0644'
      loop:
        - journal_reto.log
        - unidades_reto.txt

    - name: Generar TU misión personalizada (módulo template + facts)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/mision.txt.j2"
        dest: "{{ area }}/MISION.txt"
        mode: '0644'

    - name: Dejar la nota del equipo y asegurarla (0600 = solo su dueño)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/reto/nota_equipo.txt"
        dest: "{{ area }}/nota_equipo.txt"
        mode: '0600'

  post_tasks:
    # "Verificar antes de confiar": mostramos cuánto material quedó listo.
    - name: Contar las líneas del material del incidente
      ansible.builtin.command:
        cmd: "wc -l {{ area }}/journal_reto.log {{ area }}/unidades_reto.txt"
      changed_when: false
      register: conteo

    # Solo LEE el estado de SSH en tu máquina. No arranca ni habilita nada.
    - name: Ver cómo se llama (y cómo está) el servicio de SSH EN TU DISTRO
      ansible.builtin.command:
        cmd: "systemctl is-enabled {{ unit_ssh }}"
      changed_when: false
      failed_when: false
      register: ssh_estado

    - name: Mostrar la misión
      ansible.builtin.debug:
        msg:
          - "==============================================================="
          - "  Estación lista en:  datos/reto/     (abrí MISION.txt)"
          - "  {{ conteo.stdout_lines | join('  |  ') }}"
          - "  En {{ ansible_distribution }} el SSH se llama '{{ unit_ssh }}'
             y está: {{ ssh_estado.stdout | default('sin dato') }}"
          - "---------------------------------------------------------------"
          - "  Sos el SRE de guardia. Hacé el postmortem de web01 y armá la"
          - "  bandera con este formato EXACTO:"
          - "      BANDERA{<R1>-<R2>-<R3>}"
          - ""
          - "  R1) ¿Cuántas líneas dicen exactamente 'Failed with result'?"
          - "  R2) ¿Qué unidad juntó MÁS de esas líneas? (sin el '.service')"
          - "  R3) ¿Cuántos 'Scheduled restart job' programó systemd de ESA unidad?"
          - ""
          - "  Verificá tu bandera con Ansible (el repo NO la guarda en texto"
          - "  plano, solo su huella SHA-256):"
          - "     ansible-playbook comprobar_bandera.yml -e \"bandera=BANDERA{...}\""
          - "==============================================================="
